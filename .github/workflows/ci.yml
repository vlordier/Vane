---
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: "read"  # yamllint: truthy false-positive

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run type check
        run: npx tsc --noEmit